name: Website auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Website bauen
        shell: bash
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          base="${BASE_PATH%/}/"
          case "$base" in
            /*) ;;
            *) base="/$base" ;;
          esac
          echo "Basis $base, Adresse $ORIGIN"
          python3 build.py --base "$base" --url "$ORIGIN"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Läuft nur von Hand, solange Pages auf "Deploy from branch" steht (dann wird site/ ausgeliefert).
  # Nach Umstellung auf Settings, Pages, Source "GitHub Actions" die if-Zeile entfernen.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
